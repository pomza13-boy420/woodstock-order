<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Woodstock Koh Phangan — Menu & Order</title>
<meta name="description" content="Woodstock, Chaloklum, Koh Phangan — Thai & vegetarian food, coffee, smoothies and cocktails. See the menu and order for pickup or delivery.">
<meta property="og:title" content="Woodstock Koh Phangan — Menu & Order">
<meta property="og:description" content="Thai & vegetarian food, coffee, smoothies and cocktails in Chaloklum. Order for pickup or delivery.">
<meta property="og:image" content="shop.jpg">
<meta property="og:type" content="restaurant">
<meta name="theme-color" content="#4e342e">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Woodstock colours: brown, green, yellow, red on warm cream */
  :root {
    --brown: #4e342e; --brown-soft: #6d4c41;
    --green: #2e7d32; --yellow: #f6b918; --red: #c62828;
    --bg: #fbf5e6; --card: #fffdf8; --text: #2b1d14; --hint: #8d7b6a;
    --line: rgba(78, 52, 46, .16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
    padding-bottom: calc(160px + env(safe-area-inset-bottom));
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  .hide { display: none !important; }

  .lang { display: flex; border: 1px solid rgba(255, 255, 255, .45); border-radius: 999px; overflow: hidden; flex: none; }
  .lang button { padding: 5px 12px; font-size: 13px; font-weight: 600; color: rgba(255, 255, 255, .8); }
  .lang button.on { background: var(--yellow); color: var(--brown); }

  /* ---- home ---- */
  .hero { background: var(--brown); color: #fff8e7; padding: 18px 16px 22px; border-radius: 0 0 22px 22px; }
  .hero .row1 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .hero h1 { margin: 0; font-size: 26px; letter-spacing: .3px; }
  .hero p { margin: 8px 0 12px; font-size: 14px; opacity: .92; }
  .hero .logo { display: block; width: 190px; max-width: 60%; height: auto; margin: 10px auto 4px; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .45)); }
  .hero.haslogo p { text-align: center; }
  .hero.haslogo .facts { justify-content: center; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; }
  .facts span { background: rgba(255, 255, 255, .14); border-radius: 999px; padding: 5px 11px; font-size: 13px; }
  .home { padding: 0 16px; }
  .points {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px;
    background: var(--yellow); color: var(--brown); border-radius: 16px; padding: 12px 16px;
  }
  .points b { font-size: 22px; }
  .points small { display: block; font-size: 12px; opacity: .85; }
  .groups { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .group {
    flex: 1; border-radius: 18px; padding: 22px 10px 18px; color: #fff; text-align: center;
    font-size: 19px; font-weight: 700; box-shadow: 0 4px 14px rgba(78, 52, 46, .22);
  }
  .group .ico { display: block; font-size: 42px; line-height: 1.1; margin-bottom: 6px; }
  .group small { display: block; font-size: 12px; font-weight: 500; opacity: .9; margin-top: 2px; }
  .group.g0 { background: var(--green); }
  .group.g1 { background: var(--red); }
  .group.g2 { background: var(--brown-soft); }
  .group.g3 { background: var(--yellow); color: var(--brown); }
  .catgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 14px; }
  .cattile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; padding: 0 0 8px; text-align: center; font-size: 13px; font-weight: 700; color: var(--brown); }
  .cattile img, .cattile .emo { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; margin-bottom: 6px; }
  .cattile .emo { display: flex; align-items: center; justify-content: center; font-size: 44px; background: #f1e6cd; }
  .cattile small { display: block; font-size: 11px; font-weight: 500; color: var(--hint); }
  .group:active, .link:active { opacity: .8; }
  .group.shut { background: #9a8f86; box-shadow: none; }
  .shutbanner { background: #fff3cd; border: 1px solid var(--yellow); color: var(--brown); border-radius: 12px; padding: 10px 12px; margin: 12px 0 0; font-size: 14px; font-weight: 600; }
  .shutlabel { font-size: 13px; font-weight: 700; color: var(--hint); padding: 0 6px; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-top: 14px; }
  .box h3 { margin: 0 0 6px; font-size: 15px; color: var(--brown); }
  .box ul { margin: 0; padding-left: 18px; font-size: 14px; }
  .box li { margin: 3px 0; }
  .box li.fine { list-style: none; margin: 8px 0 0 -18px; font-size: 12px; color: var(--hint); }
  .links { display: flex; gap: 10px; margin-top: 14px; }
  .link {
    flex: 1; text-align: center; padding: 11px 6px; border-radius: 12px; font-size: 14px; font-weight: 600;
    background: var(--card); border: 1.5px solid var(--brown); color: var(--brown);
  }

  /* ---- member card ---- */
  .points { width: 100%; text-align: left; }
  .points .go { display: block; font-size: 12px; font-weight: 700; margin-top: 2px; }
  .cardview { padding: 14px 16px; }
  .cardview .back { color: var(--green); font-weight: 700; font-size: 15px; padding: 6px 0 12px; }
  .mcard {
    border-radius: 20px; padding: 18px; color: #fff8e7; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #4e342e 0%, #6d4c41 55%, #2e7d32 130%);
    box-shadow: 0 8px 22px rgba(78, 52, 46, .35);
  }
  .mcard.silver { background: linear-gradient(135deg, #8e9aa3 0%, #dfe5e9 45%, #9aa5ad 100%); color: #2b2f33; }
  .mcard.gold { background: linear-gradient(135deg, #b8860b 0%, #f6d365 45%, #c9971a 100%); color: #3b2a05; }
  .mcard .head { display: flex; align-items: center; gap: 12px; }
  .emblem {
    width: 62px; height: 62px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 30px;
    background: rgba(255, 255, 255, .22); border: 2px solid rgba(255, 255, 255, .55); overflow: hidden;
  }
  .emblem img { width: 100%; height: 100%; object-fit: contain; }
  /* the shop's own artwork: shown whole, in its own proportions, no circle around it */
  .emblem.art { width: 128px; height: 128px; border: 0; border-radius: 0; background: none; overflow: visible; }
  .emblem.art img { filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .35)); }
  .mcard .info { flex: 1; min-width: 0; }
  .mcard .shop { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; opacity: .85; }
  .mcard .level { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
  .mcard .who { font-size: 20px; font-weight: 700; margin: 12px 0 2px; word-break: break-word; }
  .mcard .pts { font-size: 15px; }
  .mcard .pts b { font-size: 34px; margin-right: 6px; }
  .mcard .dates { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; font-size: 12px; }
  .mcard .dates b { display: block; font-size: 14px; }
  .tiernote { font-size: 13px; color: var(--hint); margin: 10px 2px 0; }
  .reward { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .reward:first-of-type { border-top: 0; }
  .reward .what { flex: 1; font-size: 15px; font-weight: 600; }
  .reward .cost { display: block; font-size: 13px; font-weight: 700; color: var(--red); }
  .reward .when { display: block; font-size: 12px; font-weight: 500; color: var(--hint); }
  .reward button { flex: none; padding: 9px 16px; border-radius: 999px; background: var(--green); color: #fff; font-weight: 700; font-size: 14px; }
  .reward button.sure { background: var(--red); }
  .reward button.no { background: none; color: var(--hint); border: 1px solid var(--line); font-weight: 600; }

  /* ---- menu ---- */
  .top { position: sticky; top: 0; z-index: 5; background: var(--brown); color: #fff8e7; padding: 10px 16px 0; }
  .title { display: flex; align-items: center; gap: 10px; }
  .title h1 { margin: 0; font-size: 19px; flex: 1; }
  .title .nav { font-size: 14px; font-weight: 600; color: var(--yellow); padding: 6px 0; white-space: nowrap; }
  .gtabs { display: flex; gap: 8px; overflow-x: auto; margin: 8px -16px 0; padding: 0 16px; scrollbar-width: none; }
  .gtabs::-webkit-scrollbar { display: none; }
  .gtabs button { flex: none; padding: 9px 14px; border-radius: 12px; background: rgba(255, 255, 255, .12); color: #fff8e7; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .gtabs button.on { background: var(--green); color: #fff; }
  .gtabs button.shut { opacity: .55; }
  .shopphoto { display: block; width: 100%; max-height: 300px; object-fit: cover; border-radius: 18px; margin-top: 14px; box-shadow: 0 4px 14px rgba(78, 52, 46, .22); }
  .openmenu { width: 100%; margin-top: 12px; padding: 15px; border-radius: 16px; background: var(--green); color: #fff; font-size: 18px; font-weight: 700; box-shadow: 0 4px 14px rgba(78, 52, 46, .22); }
  .openmenu:active { opacity: .85; }
  .again { width: 100%; margin-top: 10px; padding: 13px; border-radius: 16px; background: var(--card); border: 1.5px solid var(--green); color: var(--green); font-size: 16px; font-weight: 700; }
  .search {
    width: 100%; padding: 10px 14px; border-radius: 12px; border: 0; margin-top: 8px;
    background: #fffdf8; color: var(--text); font: inherit; outline: none;
  }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; margin: 0 -16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button {
    flex: none; padding: 7px 13px; border-radius: 999px; background: rgba(255, 255, 255, .14);
    font-size: 14px; white-space: nowrap; color: #fff8e7;
  }
  .chips button.on { background: var(--yellow); color: var(--brown); font-weight: 700; }
  main { padding: 0 16px; }
  section { scroll-margin-top: 150px; }
  section h2 { margin: 20px 0 4px; font-size: 17px; color: var(--brown); }
  section .note { margin: 0 0 8px; font-size: 13px; color: var(--hint); white-space: pre-line; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 8px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .row .what { flex: 1; min-width: 0; }
  .thumb { flex: none; width: 68px; height: 68px; border-radius: 50%; object-fit: cover; background: #eadfc8; cursor: zoom-in; }
  .zoom { position: fixed; inset: 0; z-index: 50; background: rgba(30, 18, 10, .86); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
  .zoom img { width: min(92vw, 440px); aspect-ratio: 1; object-fit: cover; border-radius: 20px; }
  .zoom span { color: #fff; font-weight: 700; font-size: 17px; text-align: center; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; margin-top: 8px; }
  .tile { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; padding: 0 6px 8px;
          text-align: center; font-size: 13px; font-weight: 600; line-height: 1.25; color: var(--text); display: flex; flex-direction: column; align-items: center; }
  .tile img, .tile .emo { display: block; width: calc(100% + 12px); aspect-ratio: 1; object-fit: cover; margin: 0 -6px 6px; flex: none; }
  .tile .emo { display: flex; align-items: center; justify-content: center; font-size: 40px; background: #f1e6cd; }
  .tile .price { margin-top: auto; padding-top: 3px; font-size: 13px; }
  .tile .badge { position: absolute; top: 6px; right: 6px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; background: var(--green);
                 color: #fff; font-size: 13px; font-weight: 700; line-height: 24px; box-shadow: 0 2px 6px rgba(0, 0, 0, .3); }
  .tile .badge:empty { display: none; }
  .tile:active { opacity: .8; }
  .ishade { position: fixed; inset: 0; z-index: 30; background: rgba(30, 18, 10, .6); display: flex; align-items: flex-end; }
  .ipanel { width: 100%; max-height: 90vh; overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding: 0 16px calc(16px + env(safe-area-inset-bottom)); }
  .ipanel .pic { display: block; width: calc(100% + 32px); margin: 0 -16px; max-height: 300px; object-fit: cover; border-radius: 20px 20px 0 0; }
  .ipanel h2 { margin: 14px 0 2px; font-size: 20px; color: var(--brown); }
  .ipanel .item { margin-top: 12px; }
  .modrow { margin-top: 12px; }
  .modlabel { font-size: 13px; font-weight: 700; color: var(--brown); margin-bottom: 6px; }
  .modchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .modchips button { padding: 8px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-size: 13px; font-weight: 600; color: var(--text); }
  .modchips button.on { background: var(--yellow); border-color: var(--yellow); color: var(--brown); }
  .modhint { margin-top: 10px; font-size: 12px; color: var(--hint); }
  /* website: popular picks, hours & location, order tracking, profile */
  .picks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pick { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; text-align: left; padding: 0; display: flex; flex-direction: column; }
  .pick img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: #f3e9d2; }
  .pick b { padding: 10px 12px 0; font-size: 15px; font-weight: 600; color: var(--brown); line-height: 1.25; }
  .pick span { padding: 2px 12px 12px; font-size: 14px; font-weight: 600; color: var(--red); }
  .morebtn { width: 100%; margin-top: 12px; padding: 14px; border-radius: 999px; font-size: 16px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #37943b, var(--green)); }
  .visit { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px 16px; }
  .visit div { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.45; }
  .visit div:last-child { border-bottom: 0; }
  .visit div b { flex: 0 0 5.2em; font-weight: 600; color: var(--brown); }
  .trackbar { display: block; width: 100%; margin: 14px 0 0; padding: 12px 0; border-radius: 999px; overflow: hidden; white-space: nowrap; text-align: left; font-size: 15px; font-weight: 600; color: #fff8e7; background: var(--brown); box-shadow: var(--shadow); }
  .trackbar.live { color: var(--brown); background: var(--yellow); }
  .trackbar .run { display: inline-block; animation: tick 20s linear infinite; }
  .trackbar .run span { display: inline-block; padding: 0 28px; }
  @keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .trackbar .run { animation: none; } }
  #profBox .pbtn.ok { background: #1f5f23; }
  .ocard { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .ocard:last-child { border-bottom: 0; }
  .ocard .ohead { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; color: var(--brown); font-size: 16px; }
  .ocard .osub { font-size: 13px; color: var(--hint); margin: 2px 0 10px; }
  .ocard .osub .ok { color: var(--green); font-weight: 600; }
  .ocard .osub .no { color: var(--red); font-weight: 600; }
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { position: relative; padding: 0 0 14px 28px; font-size: 14px; color: var(--hint); }
  .tl li:last-child { padding-bottom: 2px; }
  .tl li::before { content: ""; position: absolute; left: 5px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--card); border: 2px solid var(--line); box-sizing: border-box; }
  .tl li::after { content: ""; position: absolute; left: 10px; top: 16px; bottom: 0; width: 2px; background: var(--line); }
  .tl li:last-child::after { display: none; }
  .tl li.did { color: var(--text); }
  .tl li.did::before { background: var(--green); border-color: var(--green); }
  .tl li.did::after { background: var(--green); }
  .tl li.now { color: var(--brown); font-weight: 600; }
  .tl li.now::before { background: var(--yellow); border-color: var(--yellow); box-shadow: 0 0 0 4px rgba(246, 197, 68, .3); }
  .tl li.bad { color: var(--red); font-weight: 600; }
  .tl li.bad::before { background: var(--red); border-color: var(--red); }
  .onote { font-size: 12px; color: var(--hint); margin-top: 8px; }
  #profBox p { margin: 4px 0 10px; font-size: 14px; color: var(--hint); line-height: 1.45; }
  #profBox .txt { display: block; width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; font: inherit; font-size: 16px; color: var(--text); background: var(--card); }
  #profBox .row2 { display: flex; gap: 8px; flex-wrap: wrap; }
  #profBox .pbtn { flex: 1 1 140px; padding: 13px; border-radius: 999px; font-size: 16px; font-weight: 600; color: #fff; background: var(--green); }
  #profBox .pbtn.plain { background: none; color: var(--hint); border: 1.5px solid var(--line); }
  #profBox .tag { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #f3e9d2; color: var(--brown); margin-left: 8px; vertical-align: middle; }
  @media (min-width: 900px) { .picks { grid-template-columns: repeat(4, 1fr); } }
  .pickfirst { padding: 14px; text-align: center; font-size: 14px; font-weight: 600; color: var(--hint); }
  .ipanel .done { width: 100%; margin-top: 14px; padding: 14px; border-radius: 14px; background: var(--green); color: #fff; font-size: 17px; font-weight: 700; }
  .name { font-weight: 600; }
  .desc { font-size: 13px; color: var(--hint); margin-top: 2px; }
  .price { font-weight: 700; color: var(--red); font-size: 15px; }
  .opt { padding-top: 10px; margin-top: 10px; border-top: 1px solid var(--line); }
  .opt .name { font-weight: 500; }
  .empty { text-align: center; color: var(--hint); padding: 40px 0; }

  /* ---- + / − ---- */
  .stepper { flex: none; display: flex; align-items: center; }
  .stepper button {
    width: 38px; height: 38px; border-radius: 50%; font-size: 22px; line-height: 1; font-weight: 500;
    background: var(--green); color: #fff; display: grid; place-items: center;
  }
  .stepper button.minus { background: none; color: var(--red); border: 1.5px solid var(--red); }
  .stepper .add { width: auto; border-radius: 999px; padding: 0 16px; font-size: 15px; font-weight: 600; }
  .stepper .qty { min-width: 34px; text-align: center; font-weight: 700; font-size: 17px; }
  .stepper button:active { opacity: .7; }

  /* ---- cart bar + sheet ---- */
  .bar {
    position: fixed; left: 12px; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 10;
    display: none; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--green); color: #fff; border-radius: 16px; padding: 12px 14px 12px 18px;
    font-weight: 700; font-size: 17px; width: calc(100% - 24px); box-shadow: 0 6px 20px rgba(0, 0, 0, .28);
  }
  .bar.show { display: flex; }
  .bar small { display: block; font-weight: 500; font-size: 13px; opacity: .92; text-align: left; }
  .bar .sum { background: var(--yellow); color: var(--brown); border-radius: 12px; padding: 8px 12px; }
  /* ---- loading + welcome (dark) ---- */
  .splash, .welcome { position: fixed; inset: 0; background: #080808; color: #fff; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 24px; }
  .splash { z-index: 100; justify-content: center; transition: opacity .35s; }
  .splash.out { opacity: 0; pointer-events: none; }
  .welcome { z-index: 90; padding-top: calc(48px + env(safe-area-inset-top)); overflow-y: auto;
             background: linear-gradient(#0a0c0a, #0a0c0a 62%, #0d1a10); }
  .wname { font-family: "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: clamp(34px, 11vw, 50px);
           letter-spacing: .22em; margin: 0 -.22em 0 0; line-height: 1.1; }
  .wname .g { color: #3fbf3f; } .wname .y { color: #f6c41c; } .wname .r { color: #d83030; }
  .wbar { font-size: 20px; font-weight: 800; letter-spacing: 1.6em; margin: 14px -1.6em 0 0; color: #d83030; }
  .wsub { margin-top: 14px; font-size: 12px; letter-spacing: .22em; color: #8d8d8d; }
  .wload { margin-top: 26px; font-size: 11px; letter-spacing: .3em; color: #777; }
  .wprog { width: min(64vw, 260px); height: 5px; background: #2a2a2a; margin-top: 12px; overflow: hidden; }
  .wprog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3fbf3f, #f6c41c, #d83030); animation: wload 1.3s ease-out forwards; }
  @keyframes wload { to { width: 100%; } }
  .welcome .wlogo { width: min(58vw, 230px); aspect-ratio: 1; object-fit: contain; margin-bottom: 22px; }
  .wenter { margin-top: 28px; width: min(78vw, 320px); padding: 16px; background: #f6c41c; color: #1c1408; font-size: 19px; font-weight: 800; letter-spacing: .12em;
            clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%); }

  /* ================= 2nd layer: modern look, same Woodstock colours ================= */

  /* ---- home: who we are ---- */

  .lang { background: rgba(0, 0, 0, .25); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .cta { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .openmenu { width: auto; flex: 1 1 220px; margin: 0; padding: 16px 22px; border-radius: 999px; font-size: 18px; font-weight: 600;
              background: linear-gradient(135deg, #37943b, var(--green)); box-shadow: 0 10px 26px rgba(46, 125, 50, .45); }
  .ghost { flex: 0 1 auto; padding: 16px 22px; border-radius: 999px; font-size: 16px; font-weight: 600; color: #fff8e7; border: 1.5px solid rgba(255, 255, 255, .55); }
  .home { max-width: var(--wrap); margin: 0 auto; }

  .sec::before { content: ""; width: 26px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--green), var(--yellow), var(--red)); }

  .ptrack::-webkit-scrollbar { display: none; }
  .pslide { flex: 0 0 88%; scroll-snap-align: center; position: relative; overflow: hidden; min-height: 158px; border-radius: var(--r); padding: 18px 18px 16px;
            color: #fff8e7; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; box-shadow: var(--shadow); background: linear-gradient(135deg, #37943b, #1f5f23); }
  .pslide:only-child { flex-basis: 100%; }

  .pslide .ptag { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, .22); }
  .pslide.c3 .ptag { background: rgba(43, 29, 20, .14); }

  .pdots { display: flex; justify-content: center; gap: 7px; }

  .feats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .chips button { font-weight: 500; }

            background: rgba(27, 19, 16, .94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 12px 30px rgba(0, 0, 0, .35); gap: 4px; }

  /* ---- wide screens (a computer): navigation on top, content in a centred column ---- */

    .tabbar .brand img { width: 44px; height: 44px; object-fit: contain; }

    .home { padding: 0 28px; }
    .sec { font-size: 24px; margin-top: 38px; }
    .feats { grid-template-columns: repeat(4, 1fr); gap: 18px; } .feat { padding: 22px 20px; }

    .tile, .cattile { font-size: 15px; } .tile .price { font-size: 15px; }

  /* ================= minimal theme (the last word on colours) =================
     Cream page, white cards with a hairline border instead of shadows, near-black text,
     one accent (olive green) for the buttons that matter; every other button is an outline. */
  :root {
    --bg: #FAF8F5; --card: #FFFFFF; --text: #1E1B18; --hint: #77706A; --line: #E8E4DD;
    --green: #2D5A27; --brown: #1E1B18; --brown-soft: #1E1B18; --yellow: #2D5A27; --red: #A8322A;
    --shadow: none; --shadow-lg: 0 10px 40px rgba(30, 27, 24, .10); --r: 16px;
  }
  body { background: var(--bg); color: var(--text); }
  /* cards */
  .box, .feat, .pick, .visit, .item, .pslide, .steps li, .viabox pre, .group, .points, .mcard, .sheet, .ipanel, .viabox, .catgrid button, .tile {
    box-shadow: none; }
  .box, .feat, .pick, .visit, .item, .pslide, .steps li, .group, .points { background: var(--card); border: 1px solid var(--line); }
  .feat .ic, .steps li::before, .pick img, #profBox .tag { background: var(--bg); }
  .steps li::before { color: var(--text); border: 1px solid var(--line); }
  .sec { color: var(--text); font-weight: 600; letter-spacing: -.01em; }
  .sec::before { width: 18px; height: 1px; border-radius: 0; background: var(--text); }
  /* primary buttons: the one accent, flat */
  .openmenu, .morebtn, .confirm, .ipanel .done, #profBox .pbtn, .stepper .add, .viabtn.main, .bar, .mapbtns .route, .reward button, .gtabs button.on {
    background: var(--green); color: #fff; box-shadow: none; border: 0; }
  .openmenu:hover { box-shadow: none; transform: none; }
  #profBox .pbtn.ok { background: #1F3F1B; }
  .bar .sum { background: rgba(255, 255, 255, .16); color: #fff; }
  /* secondary buttons: outline only */

  return (c || "").split("+").map(id => { const ch = (def.choices || []).find(x => x.id === id); return ch && id !== def.default ? tr(ch.tag || ch.label) : ""; }).filter(Boolean).join(" · ");
}).filter(Boolean).join(" · ");

  const [m, c] = p.split(":"), def = (menu.modifiers || {})[m] || {};

// Opening hours per menu group (e.g. the kitchen closes at night, drinks don't). The bot checks again.
const groupOfKey = {};           // cart key -> group id
const hh = h => String(h).padStart(2, "0") + ":00";
function shutNow(g) {            // the group's {from_hour, to_hour} if it is closed right now, else null
  const c = g && g.closed; if (!c) return null;
  const h = new Date(Date.now() + 7 * 3600e3).getUTCHours(), a = c.from_hour || 0, b = c.to_hour || 0;
  return (a <= b ? (h >= a && h < b) : (h >= a || h < b)) ? c : null;
}
const groupOf = key => groups().find(g => g.id === groupOfKey[baseKey(key)]);

// Same rules as the bot (which has the final say). Reaching the zone's minimum makes delivery
// free; below it there is a flat fee, or a per-km fee the staff quote. The night surcharge is separate.
function deliveryPlan(total) {
  const p = { ship: 0, quote: false, voucher: false, night: 0, zone: null, short: 0, later: false };
  if (how !== "d") return p;
  p.later = inTelegram && !!rules().shop;   // the bot prices delivery from the location the customer sends in the chat
  const z = p.zone = zones().find(x => x.id === zone) || null;
  if (z && total < (z.min || 0)) {
    p.short = (z.min || 0) - total;
    if (typeof z.fee_below === "number") p.ship = z.fee_below;
    else if (z.fee_below === "quote") p.quote = true;
    if ((p.ship || p.quote) && member.fs) { p.voucher = true; p.ship = 0; p.quote = false; }   // free-delivery voucher
  }
  const n = rules().night || {};
  if (n.fee) {
    const h = new Date(Date.now() + 7 * 3600e3).getUTCHours(), a = n.from_hour || 0, b = n.to_hour || 0;   // Bangkok time
    const night = a <= b ? (h >= a && h < b) : (h >= a || h < b);
    if (night && !(rules().free_over && total >= rules().free_over)) p.night = n.fee;
  }
  return p;
}
const perKm = z => { const k = (z && z.per_km) || [40, 100]; return `฿${k[0]}–${k[1]}`; };

function change(key, delta) {
  const q = Math.max(0, Math.min(99, (cart[key] || 0) + delta));
  if (q) cart[key] = q; else delete cart[key];
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  refresh();
}

function drawStepper(box) {
  const key = box.dataset.key, q = cart[key] || 0;
  box.textContent = "";
  const shut = !!shutNow(groupOf(key));   // closed right now: nothing can be added, only removed
  if (!q) {
    if (shut) { box.append(el("span", "shutlabel", t().shut)); return; }
    const b = el("button", "add", t().add); b.onclick = () => change(key, 1); box.append(b);
    return;
  }
  const minus = el("button", "minus", "−"), plus = el("button", "", "+");
  minus.onclick = () => change(key, -1); plus.onclick = () => change(key, 1);
  box.append(minus, el("span", "qty", q));
  if (!shut) box.append(plus);
}
function stepper(key) { const s = el("div", "stepper"); s.dataset.key = key; drawStepper(s); return s; }

function thumb(it) {   // the item's picture (menu.json "img"); tap to see it large. No file → no picture.
  const im = el("img", "thumb"); im.loading = "lazy"; im.alt = ""; im.src = it.img;
  im.onerror = () => im.remove();
  im.onclick = () => {
    const z = el("div", "zoom"), big = el("img"); big.src = it.img; big.alt = "";
    z.append(big, el("span", "", tr(it.name))); z.onclick = () => z.remove(); document.body.append(z);
  };

}
function inCart(id) {   // how many of this item (all its options) are in the cart
  return Object.keys(cart).reduce((n, k) => n + (k === id || k.startsWith(id + "~") || k.startsWith(id + "@") ? cart[k] : 0), 0);
}
function openItem(it, cat) {   // details of one item: picture, description, options with their add buttons
  const shade = el("div", "ishade"), panel = el("div", "ipanel");
  if (it.img) { const im = el("img", "pic"); im.alt = ""; im.src = it.img; panel.append(im); }
  panel.append(el("h2", "", tr(it.name)));
  if (it.desc) panel.append(el("div", "desc", tr(it.desc)));
  const card = el("div", "item"), defs = menu.modifiers || {};
  const mods = ((cat && cat.mods) || []).filter(m => defs[m] && !(it.no_mods || []).includes(m)), pick = {};
  // A modifier with "max" above 1 takes several choices (fruit: 2–3); one without "default" must be chosen (base: pick 1).
  const multi = m => (defs[m].max || 1) > 1, least = m => defs[m].min != null ? defs[m].min : (defs[m].default == null ? 1 : 0);
  const order = m => defs[m].choices.map(c => c.id);
  for (const m of mods) pick[m] = multi(m) ? [] : defs[m].default;
  const ready = () => mods.every(m => multi(m) ? pick[m].length >= least(m) : pick[m] != null);
  const tail = optId => {   // "@s:50,i:sep" for the choices that differ from the usual; "" when all are usual
    const parts = mods.filter(m => !(optId && (defs[m].not_options || []).includes(optId)) && (multi(m) ? pick[m].length : pick[m] != null && pick[m] !== defs[m].default))
      .map(m => m + ":" + (multi(m) ? order(m).filter(id => pick[m].includes(id)).join("+") : pick[m]));
    return parts.length ? "@" + parts.join(",") : "";
  };
  const rows = () => {
    card.textContent = "";
    if (!ready()) { card.append(el("div", "pickfirst", t().pickFirst)); return; }
    if (it.options && it.options.length) it.options.forEach((o, i) => { const k = it.id + "~" + o.id + tail(o.id); card.append(itemRow(k, tr(o.name), "", o.price + modExtra(k), i ? "opt" : "")); });
    else { const k = it.id + tail(""); card.append(itemRow(k, t().price, "", it.price + modExtra(k))); }
  };
  for (const m of mods) {   // sweetness, ice: choose first, then add
    const max = defs[m].max || 1, must = least(m);
    const wrap = el("div", "modrow"); wrap.append(el("div", "modlabel", tr(defs[m].label) + (must ? " — " + t().pickN(must, max) : "")));
    const line = el("div", "modchips");
    for (const ch of defs[m].choices) {
      const b = el("button", ch.id === pick[m] ? "on" : "", tr(ch.label) + (ch.price ? " +" + money(ch.price) : ""));
      b.onclick = () => {
        if (multi(m)) {
          if (pick[m].includes(ch.id)) pick[m] = pick[m].filter(x => x !== ch.id);
          else if (pick[m].length < max) pick[m].push(ch.id);
          b.classList.toggle("on", pick[m].includes(ch.id));
        } else { pick[m] = ch.id; line.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); }
        rows();
      };
      line.append(b);
    }
    wrap.append(line); panel.append(wrap);
  }
  if (mods.some(m => defs[m].default != null)) panel.append(el("div", "modhint", t().modHint));
  rows();
  const done = el("button", "done", t().done);
  panel.append(card, done); shade.append(panel);
  done.onclick = () => shade.remove();
  shade.onclick = e => { if (e.target === shade) shade.remove(); };

function itemRow(key, name, desc, price, cls) {

// Promos & events (about.promos in catalog.json): { type: "promo" | "event" | "news", icon, title, text, img, go, from, until }.
// go = "menu" | "card" | "map" | a web link.  from / until = "YYYY-MM-DD": the slide shows only inside those days.
let promoTimer = 0, promoHold = 0;
function renderPromos() {
  const today = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Bangkok" });
  const list = ((menu.about || {}).promos || []).filter(p => p && tr(p.title) && (!p.from || p.from <= today) && (!p.until || p.until >= today));
  const box = $("promos"), track = $("ptrack"), dots = $("pdots");
  box.classList.toggle("hide", !list.length);
  track.textContent = ""; dots.textContent = "";
  if (!list.length) return;
  $("promoTitle").textContent = t().promoTitle;
  list.forEach((p, i) => {
    const s = el("div", "pslide c" + (i % 4));
    if (p.img) { const im = document.createElement("img"); im.alt = ""; im.loading = "lazy"; im.onload = () => s.classList.add("pic"); im.onerror = () => im.remove(); im.src = p.img; s.append(im); }
    if (p.icon) s.append(el("span", "pic0", p.icon));
    s.append(el("span", "ptag", t().ptags[p.type] || t().ptags.promo), el("b", "", tr(p.title)));
    if (tr(p.text)) s.append(el("small", "", tr(p.text)));
    if (p.go) {
      const view = ["menu", "card", "map"].includes(p.go) ? p.go : "";
      s.classList.add("tap"); s.setAttribute("role", "button"); s.tabIndex = 0;
      s.append(el("span", "pgo", t().pgo[view || "link"]));
      s.onclick = () => view ? show(view) : /^https:\/\//.test(p.go) && openUrl(p.go);
      s.onkeydown = e => { if (e.key === "Enter") s.onclick(); };
    }
    track.append(s);
    dots.append(document.createElement("i"));
  });
  dots.classList.toggle("hide", list.length < 2);
  const at = () => { let best = 0, d = 1e9; [...track.children].forEach((c, i) => { const x = Math.abs(c.offsetLeft - track.offsetLeft - track.scrollLeft); if (x < d) { d = x; best = i; } }); return best; };
  const mark = () => { const n = track.scrollLeft >= track.scrollWidth - track.clientWidth - 4 ? list.length - 1 : at(); [...dots.children].forEach((c, i) => c.classList.toggle("on", i === n)); };
  track.onscroll = mark; mark();
  const hold = () => { promoHold = Date.now() + 8000; };
  ["pointerdown", "touchstart", "wheel", "mouseenter", "focusin"].forEach(ev => track.addEventListener(ev, hold, { passive: true }));
  clearInterval(promoTimer);
  if (list.length > 1 && !matchMedia("(prefers-reduced-motion: reduce)").matches) promoTimer = setInterval(() => {
    if (Date.now() < promoHold || document.hidden || !track.offsetParent) return;
    const end = track.scrollLeft >= track.scrollWidth - track.clientWidth - 4;
    const next = end ? 0 : at() + 1;
    track.scrollTo({ left: end ? 0 : track.children[Math.min(next, list.length - 1)].offsetLeft - track.offsetLeft, behavior: "smooth" });
  }, 4500);
}
function renderHome() {

  }
  $("hours").textContent = "🕘 " + tr(a.hours); $("hours").classList.toggle("hide", !tr(a.hours));

  $("pointsValue").textContent = myPoints.toLocaleString("en-US");
  $("pointsGo").textContent = t().pointsGo;
  const ph = $("shopPhoto");   // the shop's own photo: webapp/<about.photo>

  $("openMenu").textContent = t().openMenu; $("heroMap").textContent = t().heroMap;

  const feats = $("feats"); feats.textContent = "";

  $("sinceLabel").textContent = t().since; $("untilLabel").textContent = t().until;
  const d = new Date((member.s + 7 * 3600) * 1000), two = n => String(n).padStart(2, "0");   // Bangkok date
  $("cardSince").textContent = member.s ? `${two(d.getUTCDate())}/${two(d.getUTCMonth() + 1)}/${d.getUTCFullYear()}` : t().noSince;

  $("tierNote").textContent = !inTelegram ? (member.s ? t().webCardHas : t().webCardNone) : !member.s ? t().tierStart
    : next ? t().tierNext(Math.max(1, Math.ceil((next.after_days || 0) - days)), tr(next.label)) : (tiers.length ? t().tierTop : "");
  const em = $("emblem");   // the members-only symbol: webapp/<card_image>, or a leaf until one is uploaded
  if (P.card_image && !em.dataset.done) {

    img.onload = () => { em.textContent = ""; em.classList.add("art"); em.append(img); };
    img.src = P.card_image;

  const vs = $("vouchers"); vs.textContent = "";
  if (member.d) vs.append(el("li", "", t().discV(member.d, member.dx || "—")));

          b.classList.add("sure"); b.textContent = t().sure; return;

function openGroup(id) {
  group = id; $("search").value = "";
  renderMenu(); show("menu");
}

function renderMenu() {
  if (!menu || !group) return;
  const gs = groups(), g = gs.find(x => x.id === group) || gs[0];
  const other = gs.length > 1 ? gs[(gs.indexOf(g) + 1) % gs.length] : null;
  $("toHome").textContent = t().home;
  $("groupTitle").textContent = (g.icon ? g.icon + " " : "") + tr(g.label);
  const gt = $("gtabs"); gt.textContent = "";   // the groups (food, drinks, …): tap to switch
  for (const x of gs) {
    const b = el("button", x.id === g.id ? "on" : "", (x.icon ? x.icon + " " : "") + tr(x.label));
    if (shutNow(x)) b.classList.add("shut");
    b.onclick = () => openGroup(x.id); gt.append(b);
  }
  const cur = gt.querySelector(".on"); if (cur) cur.scrollIntoView({ block: "nearest", inline: "center" });
  const q = $("search").value.trim().toLowerCase();
  const box = $("menu"), chips = $("chips");
  box.textContent = ""; chips.textContent = "";
  const shut = shutNow(g);
  if (shut) box.append(el("p", "shutbanner", t().closedBanner(tr(g.label), hh(shut.from_hour || 0), hh(shut.to_hour || 0))));
  const mine = g.categories.map(id => menu.categories.find(c => c.id === id)).filter(Boolean);   // in the group's own order
  if (!q && mine.length > 1) {   // picture grid of this group's categories: tap one to jump to it
    const grid = el("div", "catgrid");
    for (const cat of mine) {
      const label = tr(cat.label), cut = label.indexOf(" "), pic = cat.items.find(it => it.img);
      const tile = el("button", "cattile");
      if (pic) { const im = el("img"); im.loading = "lazy"; im.alt = ""; im.src = pic.img; tile.append(im); }
      else tile.append(el("span", "emo", cut > 0 ? label.slice(0, cut) : "🍽"));
      tile.append(document.createTextNode(cut > 0 ? label.slice(cut + 1) : label), el("small", "", t().nItems(cat.items.length)));
      tile.onclick = () => { const sec = document.getElementById("cat-" + cat.id); if (sec) sec.scrollIntoView({ behavior: "smooth", block: "start" }); };
      grid.append(tile);
    }
    box.append(grid);
  }
  for (const cat of mine) {
    const items = cat.items.filter(it => !q || Object.values(it.name).join(" ").toLowerCase().includes(q)
      || (it.options || []).some(o => Object.values(o.name).join(" ").toLowerCase().includes(q)));
    if (!items.length) continue;
    const sec = el("section"); sec.id = "cat-" + cat.id;
    sec.append(el("h2", "", tr(cat.label)));
    if (cat.note) sec.append(el("p", "note", tr(cat.note)));
    const tiles = el("div", "tiles"), label = tr(cat.label), cut = label.indexOf(" ");
    for (const it of items) {   // picture + name + price; the details open on tap
      const tile = el("button", "tile");
      if (it.img) { const im = el("img"); im.loading = "lazy"; im.alt = ""; im.src = it.img; tile.append(im); }
      else tile.append(el("span", "emo", cut > 0 ? label.slice(0, cut) : "🍽"));
      const prices = (it.options && it.options.length) ? it.options.map(o => o.price) : [it.price];
      const low = Math.min(...prices);
      const badge = el("span", "badge"); badge.dataset.item = it.id;
      tile.append(document.createTextNode(tr(it.name)), el("span", "price", money(low) + (Math.max(...prices) > low ? "+" : "")), badge);
      tile.onclick = () => openItem(it, cat);
      tiles.append(tile);
    }
    sec.append(tiles);
    box.append(sec);
    const chip = el("button", "", tr(cat.label)); chip.dataset.cat = cat.id;
    chip.onclick = () => sec.scrollIntoView({ behavior: "smooth", block: "start" });
    chips.append(chip);
  }
  if (!box.querySelector("section")) box.append(el("p", "empty", t().none));
  watchSections();
}

let observer = null;
function watchSections() {
  if (observer) observer.disconnect();
  if (!("IntersectionObserver" in window)) return;
  observer = new IntersectionObserver(entries => {
    for (const e of entries) if (e.isIntersecting) {
      const id = e.target.id.slice(4);
      document.querySelectorAll("#chips button").forEach(c => {
        const on = c.dataset.cat === id; c.classList.toggle("on", on);
        if (on) c.scrollIntoView({ block: "nearest", inline: "center" });
      });
    }
  }, { rootMargin: "-160px 0px -60% 0px" });
  document.querySelectorAll("section").forEach(s => observer.observe(s));
}

  document.querySelectorAll(".stepper").forEach(drawStepper);
  document.querySelectorAll(".tile .badge").forEach(b => { b.textContent = inCart(b.dataset.item) || ""; });
  const keys = Object.keys(cart);
  const count = keys.reduce((n, k) => n + cart[k], 0), total = foodTotal();
  $("bar").classList.toggle("show", count > 0);
  $("barCount").textContent = t().items(count);
  $("barHint").textContent = t().view;
  $("barTotal").textContent = money(total);
  $("totalValue").textContent = money(total);
  const lines = $("lines"); lines.textContent = "";

// ---------------- order details ----------------
function payload() {
  const d = { cart, method: how, pay, lang, cname: $("cname").value.trim().slice(0, 60), phone: $("cphone").value.trim().slice(0, 20) };
  const addr = $("addr").value.trim(), note = $("note").value.trim();
  if (how === "d" && zone) d.zone = zone;
  if (how === "d" && addr) d.address = addr;
  if (how === "d" && loc) d.loc = loc;
  if (note) d.note = note;
  return JSON.stringify(d);
}

function problem() {
  const sg = shutGroupInCart();
  if (sg) return t().needRemove(tr(sg.label), hh(sg.closed.to_hour || 0));
  if (!$("cname").value.trim()) return t().needName;
  if ($("cphone").value.replace(/\D/g, "").length < 8) return t().needPhone;
  if (!how) return t().needHow;
  if (how === "d") {
    if (zones().length && !zone) return t().needZone;
    const z = zones().find(x => x.id === zone), total = foodTotal();
    if (z && z.contact) return (inTelegram ? t().needContact : t().webContact)(tr(z.label));
    if (z && total < (z.min || 0) && z.fee_below == null)   // only zones with no small-order fee refuse return t().needMin(money(z.min), money(z.min - total));
    if ((!inTelegram || !rules().shop) && !$("addr").value.trim() && !loc) return t().needAddr;   // with a shop pin set, the bot asks for the location in the chat
  }
  if (!pay) return t().needPay;
  return "";
}

function drawDetails() {
  if (!menu) return;
  const o = opt();
  if (!inTelegram) pay = "q";   // website orders are paid by transfer once the shop confirms, before delivery / pickup
  if (!how && o.pickup !== o.delivery) how = o.pickup ? "p" : "d";   // only one way offered: preselect it
  if (!pay && o.qr !== o.cash) pay = o.qr ? "q" : "c";
  $("howP").classList.toggle("hide", !o.pickup); $("howD").classList.toggle("hide", !o.delivery);
  $("payQ").classList.toggle("hide", !o.qr); $("payC").classList.toggle("hide", !o.cash || !inTelegram);
  if (!inTelegram) $("payQ").textContent = t().payWeb;
  document.querySelectorAll("[data-how]").forEach(b => b.classList.toggle("on", b.dataset.how === how));
  document.querySelectorAll("[data-pay]").forEach(b => b.classList.toggle("on", b.dataset.pay === pay));
  document.querySelectorAll("[data-zone]").forEach(b => b.classList.toggle("on", b.dataset.zone === zone));
  $("addrBox").classList.toggle("hide", how !== "d");
  $("zoneBox").classList.toggle("hide", !zones().length);
  $("locBtn").textContent = loc ? t().locOk : t().useLoc;
  const total = foodTotal(), p = deliveryPlan(total);
  const web = !inTelegram, ask = web && how === "d" && !p.zone;   // in a browser the shop quotes the delivery fee in the chat
  $("webBox").classList.remove("hide");   // name and number: asked on the website and in Telegram alike
  $("foodTotal").textContent = money(total);
  $("feeRow").classList.toggle("hide", how !== "d");
  $("feeValue").textContent = ask ? t().feeStaff : p.later ? t().feeLater : p.voucher ? t().feeVoucher : p.quote ? t().feeQuote(perKm(p.zone)) : p.ship ? money(p.ship) : t().free;
  $("locLater").textContent = p.later ? t().locLater : ask && !loc ? t().webLoc : "";
  $("addrLabel").textContent = p.later ? t().addrOpt : t().addr;
  $("nightRow").classList.toggle("hide", !p.night);
  $("nightValue").textContent = money(p.night);
  const disc = Math.min(member.d || 0, total);   // a points voucher comes off automatically (the bot decides)
  $("discRow").classList.toggle("hide", !disc);
  $("discValue").textContent = "-" + money(disc);
  $("dTotal").textContent = money(total + p.ship + p.night - disc) + (p.quote || p.later || ask ? " +" : "");
  // Under the zones: what this bill means for delivery, and how much more makes it free.
  const zh = $("zoneHint"), z = p.zone;
  zh.textContent = how !== "d" || !z || z.contact ? "" : !p.short ? t().zFree
    : p.voucher ? t().zVoucher : p.ship ? t().zFlat(money(p.ship), money(p.short))
    : p.quote ? t().zQuote(perKm(z), money(p.short)) : "";
  const bad = problem();
  $("dHint").textContent = bad || (web ? (pay === "q" ? t().qrWeb : t().webHint) : p.later ? t().laterHint : pay === "q" ? t().qrHint : t().cashHint);
  $("dHint").classList.toggle("warn", !!bad);
  $("send").textContent = web ? t().webSend : p.later ? t().sendLater : pay === "q" ? t().sendQr : t().sendCash;
  $("send").classList.toggle("off", !!bad);
  $("testnote").textContent = inTelegram || !params.has("debug") ? "" : t().test + payload();
}

function drawZones() {
  const box = $("zones"); box.textContent = "";
  for (const z of zones()) {
    const b = el("button", "choice", tr(z.label)); b.dataset.zone = z.id;
    b.append(el("small", "", z.contact ? t().contactUs : t().freeFrom(money(z.min || 0))));
    b.onclick = () => { zone = z.id; drawDetails(); };
    box.append(b);
  }
}

function openDetails(on) {
  $("details").classList.toggle("show", on);

}

// Telegram's own location service (needs a recent app); the button stays hidden when it isn't there.
const LM = tg && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0") && tg.LocationManager;
if (inTelegram && LM) {
  try { LM.init(() => { if (LM.isLocationAvailable) $("locBtn").classList.remove("hide"); }); } catch (e) {}
}
if (!inTelegram && navigator.geolocation) $("locBtn").classList.remove("hide");
$("locBtn").onclick = () => {
  if (loc) { loc = null; return drawDetails(); }
  if (!inTelegram) {   // a normal browser asks the customer for permission itself
    navigator.geolocation.getCurrentPosition(
      g => { loc = [Number(g.coords.latitude.toFixed(6)), Number(g.coords.longitude.toFixed(6))]; drawDetails(); },
      () => { $("locBtn").textContent = t().locFail; }, { enableHighAccuracy: true, timeout: 15000 });
    return;
  }
  try {
    LM.getLocation(d => {
      if (d && typeof d.latitude === "number") loc = [Number(d.latitude.toFixed(6)), Number(d.longitude.toFixed(6))];
      else $("locBtn").textContent = t().locFail;
      if (loc) drawDetails();
    });
  } catch (e) { $("locBtn").textContent = t().locFail; }
};
document.querySelectorAll("[data-how]").forEach(b => b.onclick = () => { how = b.dataset.how; drawDetails(); });
document.querySelectorAll("[data-pay]").forEach(b => b.onclick = () => { pay = b.dataset.pay; drawDetails(); });
$("addr").oninput = $("note").oninput = drawDetails;
$("dBack").onclick = () => { openDetails(false); openSheet(true); };
$("send").onclick = () => {
  if (!Object.keys(cart).length || problem()) return drawDetails();
  if (inTelegram) tg.sendData(payload());   // closes the app; the bot sends the order or the QR
  else if ((menu.about || {}).order_inbox) sendAuto();
  else openVia();
};

// ---------------- browser only: the order goes to the shop by itself ----------------
// about.order_inbox (catalog.json) is the shop's order inbox; the bot collects from it and posts the order in the
// shop's group. Only the order code is sent (items, name, phone, address) — prices come from the shop's own menu.
// If the inbox cannot be reached, the customer sends the same order by WhatsApp instead (openVia).
let sending = false;
async function sendAuto() {
  if (sending) return;
  const text = orderText(), code = (text.match(/W1:([A-Za-z0-9_-]+)/) || [])[1], btn = $("send"), label = btn.textContent;
  sending = true; btn.textContent = t().sending; btn.classList.add("off");
  let ok = false;
  try {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 25000);
    // text/plain keeps this a "simple" request: Apps Script web apps do not answer CORS preflights
    const r = await fetch(menu.about.order_inbox, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ kind: "order", code }), signal: ctl.signal });
    clearTimeout(timer);
    ok = !!(await r.json()).ok;
  } catch (e) { ok = false; }
  sending = false; btn.textContent = label; btn.classList.remove("off");
  if (!ok) return openVia(text, true);   // the same text, so the shop's system sees one order even if both arrive
  const a = menu.about || {}, box = $("viaBtns");
  let wa = String(a.whatsapp || "").replace(/\D/g, "");
  if (wa.startsWith("0")) wa = "66" + wa.slice(1);
  const link = (label2, href) => { const b = el("a", "viabtn", label2); b.href = href; b.rel = "noopener"; box.append(b); return b; };
  box.textContent = "";
  $("viaTitle").textContent = t().sentTitle; $("viaHint").textContent = t().sentHint;
  $("viaText").textContent = text.split("\n").filter(l => !l.startsWith("🔑")).join("\n").replace(/^\/web /, "");
  myOrders.unshift({ k: lastK, ts: Date.now(), sum: foodTotal(), m: how, v: null }); myOrders = myOrders.slice(0, 10); LS.set("ws_orders", myOrders);
  const done = el("button", "viabtn main", "📦 " + t().site.track);
  done.onclick = () => { $("via").classList.remove("show"); openDetails(false); renderCard(); show("card"); };
  box.append(done);
  setTimeout(pollOrders, 12000);
  if (wa) link("🟢 " + t().sentWa, "https://wa.me/" + wa).target = "_blank";
  if (a.phone) link(t().callShop, "tel:" + a.phone.replace(/[^0-9+]/g, ""));
  for (const k of Object.keys(cart)) delete cart[k];
  refresh();
  $("via").classList.add("show");
}

// ---------------- browser only: the order as a message for the shop ----------------
// No Telegram, no server: the order becomes a text the customer sends with WhatsApp / LINE (about.whatsapp,
// about.line in catalog.json), copies, or reads out on the phone. Staff read Thai, so the text is Thai.
function orderText() {
  const keep = lang; lang = "th";
  try {
    const total = foodTotal(), p = deliveryPlan(total), L = ["/web 🧾 ออเดอร์จากเว็บ Woodstock"];
    const addr = $("addr").value.trim(), note = $("note").value.trim();
    L.push(`👤 ${$("cname").value.trim()} · 📞 ${$("cphone").value.trim()}`);
    for (const k of Object.keys(cart)) L.push(`• ${nameOf(k)} × ${cart[k]} = ${money(priceOf(k) * cart[k])}`);
    L.push(`💰 ค่าอาหาร ${money(total)}`);
    let plus = "";
    if (how === "d") {
      L.push("🛵 จัดส่ง" + (p.zone ? ` (${tr(p.zone.label)})` : ""));
      if (addr) L.push("🏠 " + addr);
      if (loc) {
        const shop = rules().shop, rad = x => x * Math.PI / 180;
        if (shop) {
          const h = Math.sin(rad(loc[0] - shop[0]) / 2) ** 2 + Math.cos(rad(shop[0])) * Math.cos(rad(loc[0])) * Math.sin(rad(loc[1] - shop[1]) / 2) ** 2;
          L.push(`📏 ประมาณ ${(2 * 6371 * Math.asin(Math.sqrt(h)) * (rules().road_factor || 1.4)).toFixed(1)} กม. จากร้าน`);
        }
        L.push(`📍 https://maps.google.com/?q=${loc[0]},${loc[1]}`);
      }
      if (!p.zone || p.quote) { L.push("🛵 ค่าส่ง: รอร้านแจ้ง"); plus = " + ค่าส่ง"; }
      else L.push("🛵 ค่าส่ง: " + (p.ship ? money(p.ship) : "ฟรี"));
      if (p.night) L.push(`🌙 ค่าบริการรอบดึก ${money(p.night)}`);
    } else L.push("🏪 รับที่ร้าน");
    L.push(`💵 ยอดรวม ${money(total + p.ship + p.night)}${plus}`);
    L.push("💳 ชำระ: โอนก่อน — รอร้านยืนยันและส่ง QR");
    if (note) L.push("📝 " + note);
    if (keep !== "th") L.push("🌐 ลูกค้าใช้ภาษา: " + keep.toUpperCase());
    // The same order for the shop's system: staff paste this whole message into the shop's Telegram group.
    const code = { c: cart, m: how, n: $("cname").value.trim().slice(0, 60), t: $("cphone").value.trim().slice(0, 20), g: keep, ts: Math.floor(Date.now() / 1000) };
    if (how === "d" && addr) code.a = addr;
    if (how === "d" && loc) code.l = loc;
    if (note) code.o = note;
    code.k = lastK = rnd(18);                 // this phone follows the order with it ("track my order")
    if (acct && acct.mk) code.mk = acct.mk;   // a signed-up member: the points show in the profile
    const bytes = new TextEncoder().encode(JSON.stringify(code));
    let bin = ""; for (const b of bytes) bin += String.fromCharCode(b);
    L.push("🔑 W1:" + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""));
    return L.join("\n");
  } finally { lang = keep; }
}

function openVia(sameText, failed) {
  const a = menu.about || {}, text = sameText || orderText(), box = $("viaBtns");
  const link = (label, href, cls) => { const b = el("a", "viabtn" + (cls ? " " + cls : ""), label); b.href = href; b.target = "_blank"; b.rel = "noopener"; box.append(b); return b; };
  let wa = String(a.whatsapp || "").replace(/\D/g, "");
  if (wa.startsWith("0")) wa = "66" + wa.slice(1);   // a Thai number written the local way
  box.textContent = "";
  $("viaTitle").textContent = t().viaTitle; $("viaText").textContent = text;
  $("viaHint").textContent = (failed ? t().autoFail + "\n" : "") + (wa || a.line ? t().viaHint : t().viaNone);
  if (wa) link("🟢 " + t().wa, `https://wa.me/${wa}?text=${encodeURIComponent(text)}`, "main");
  if (a.line) link("💬 " + t().lineBtn, `https://line.me/R/oaMessage/${encodeURIComponent(a.line)}/?${encodeURIComponent(text)}`, wa ? "" : "main");
  const copy = el("button", "viabtn", t().copy);
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(text); }
    catch (e) { const r = document.createRange(); r.selectNodeContents($("viaText")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); try { document.execCommand("copy"); } catch (e2) {} }
    copy.textContent = t().copied;
  };
  box.append(copy);
  if (a.phone) link(t().callShop, "tel:" + a.phone.replace(/[^0-9+]/g, "")).removeAttribute("target");
  const done = el("button", "viabtn", t().viaDone);
  done.onclick = () => { for (const k of Object.keys(cart)) delete cart[k]; $("via").classList.remove("show"); openDetails(false); refresh(); };
  const back = el("button", "viabtn plain", t().viaBack);
  back.onclick = () => $("via").classList.remove("show");
  box.append(done, back);
  $("via").classList.add("show");
}

// ---------------- website: track my order, profile (member / guest), the site's home sections ----------------
// The page can read two things back from the shop's inbox (about.order_inbox), each with a code only this phone has:
// where an order is (the order's own code, kept in localStorage "ws_orders") and a member's points ("ws_acct").
const LS = {
  get: k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const rnd = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(b => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join(""); };
const b64u = o => { let bin = ""; for (const b of new TextEncoder().encode(JSON.stringify(o))) bin += String.fromCharCode(b); return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
let myOrders = LS.get("ws_orders") || [];   // newest first: { k, ts, sum, v: what the shop last said }
let acct = LS.get("ws_acct");                // { mk, n, t } once signed up on this phone
let lastK = "";                              // the tracking code of the order being sent
const inboxUrl = () => (menu && menu.about || {}).order_inbox || "";
async function ask(q) {
  try { const d = await (await fetch(inboxUrl() + "?" + q + "&_=" + Date.now())).json(); return d && d.ok ? d.v : null; } catch (e) { return null; }
}
const finalState = v => v && (v.s === "done" || v.s === "cancelled" || v.s === "void");
const liveOrders = () => myOrders.filter(o => !finalState(o.v) && Date.now() - o.ts < 36 * 3600e3);
function drawOrders() {
  const S = t().site, box = $("orderList"); box.textContent = "";
  $("ordersTitle").textContent = S.ordersTitle;
  $("ordersBox").classList.toggle("hide", inTelegram);
  if (!myOrders.length) {
    const go = el("button", "morebtn", S.orderNow); go.onclick = () => $("openMenu").click();
    box.append(el("div", "onote", S.noOrders), go);
  }
  for (const o of myOrders.slice(0, 5)) {
    const v = o.v, card = el("div", "ocard"), d = new Date(o.ts), two = n => String(n).padStart(2, "0");
    const head = el("div", "ohead"); head.append(el("span", "", v && v.o ? "#" + v.o : S.waiting), el("span", "", money(v && v.t != null ? v.t : o.sum) + (v && v.m === "d" && !v.f && !finalState(v) ? "+" : "")));
    const sub = el("div", "osub"); sub.append(document.createTextNode(`${two(d.getDate())}/${two(d.getMonth() + 1)} ${two(d.getHours())}:${two(d.getMinutes())} · `));
    if (v) sub.append(el("span", v.p ? "ok" : "no", v.p ? S.paid : S.unpaid));
    card.append(head, sub);
    const steps = (v ? v.m : o.m) === "d" ? ["new", "acc", "prep", "pack", "out", "done"] : ["new", "acc", "prep", "rdy", "done"];
    const tl = el("ul", "tl"), at = v ? steps.indexOf(v.s) : 0;
    if (v && (v.s === "cancelled" || v.s === "void")) tl.append(el("li", "bad", S.st.cancelled));
    else steps.forEach((s, i) => tl.append(el("li", i < at || (i === at && s === "done") ? "did" : i === at ? "now" : "", S.st[s === "done" ? ((v ? v.m : o.m) === "d" ? "done_d" : "done_p") : s])));
    card.append(tl);
    box.append(card);
  }
  if (liveOrders().length) box.append(el("div", "onote", S.auto));
  // the running strip on the home page: the order being followed, or else the shop's promos
  const live = inTelegram ? null : liveOrders()[0], bar = $("trackBar"), lv = live && live.v;
  const promos = ((menu.about || {}).promos || []).map(p => [p.icon, tr(p.title)].filter(Boolean).join(" ")).filter(Boolean);
  const text = live ? S.tick(lv && lv.o, S.st[lv ? (lv.s === "done" ? (lv.m === "d" ? "done_d" : "done_p") : lv.s) : "new"] || S.st.new) : [S.hello, ...promos].join("   ✦   ");
  bar.classList.remove("hide"); bar.classList.toggle("live", !!live);
  if (bar.dataset.text !== text) {
    bar.dataset.text = text; bar.textContent = "";
    const run = el("span", "run"); run.append(el("span", "", text), el("span", "", text));
    run.style.animationDuration = Math.max(12, text.length * 0.28) + "s";
    bar.append(run);
  }
  bar.onclick = () => { if (live) { renderCard(); show("card"); } else $("openMenu").click(); };
}
let pollBusy = false;
async function pollOrders() {
  if (inTelegram || pollBusy || !inboxUrl() || document.hidden) return;
  pollBusy = true;
  let changed = false;
  for (const o of liveOrders().slice(0, 3)) {
    const v = await ask("track=" + o.k);
    if (v && JSON.stringify(v) !== JSON.stringify(o.v)) { o.v = v; changed = true; }
  }
  if (acct && acct.mk && (changed || !pollOrders.memberAt || Date.now() - pollOrders.memberAt > 120e3)) {
    pollOrders.memberAt = Date.now();
    const u = await ask("member=" + acct.mk);
    if (u) { member.n = u.n || acct.n; member.p = u.p || 0; member.s = u.s || 0; member.x = u.x || ""; myPoints = Math.max(0, parseInt(u.p, 10) || 0); changed = true; }
  }
  pollBusy = false;
  if (changed) { LS.set("ws_orders", myOrders.slice(0, 10)); drawOrders(); if (!$("cardView").classList.contains("hide")) renderCard(); $("pointsValue").textContent = myPoints.toLocaleString("en-US"); }
}
function drawProfile() {
  const S = t().site, box = $("profBox"); box.textContent = "";
  box.classList.toggle("hide", inTelegram);
  if (inTelegram) return;
  const h = el("h3", "", acct ? S.acctTitle : S.regTitle); h.append(el("span", "tag", acct ? S.memberTag : S.guestTag));
  const name = el("input", "txt"), phone = el("input", "txt"), msg = el("p", "", acct ? "" : S.regHint), row = el("div", "row2");
  name.maxLength = 60; name.placeholder = S.nameL; name.autocomplete = "name"; name.value = acct ? acct.n : $("cname").value;
  phone.maxLength = 20; phone.placeholder = S.phoneL; phone.type = "tel"; phone.inputMode = "tel"; phone.autocomplete = "tel"; phone.value = acct ? acct.t : $("cphone").value;
  const go = el("button", "pbtn", acct ? S.saveBtn : S.regBtn);
  go.onclick = async () => {
    const n = name.value.trim(), ph = phone.value.trim();
    if (!n || ph.replace(/\D/g, "").length < 8) { msg.textContent = S.needBoth; return; }
    go.disabled = true; go.textContent = S.saving;
    acct = { mk: acct && acct.mk || rnd(20), n, t: ph }; LS.set("ws_acct", acct);
    $("cname").value = n; $("cphone").value = ph; try { localStorage.setItem("ws_name", n); localStorage.setItem("ws_phone", ph); } catch (e) {}
    member.n = n;
    if (inboxUrl()) { try { await fetch(inboxUrl(), { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ kind: "order", code: b64u({ reg: 1, n, t: ph, mk: acct.mk, g: lang, ts: Math.floor(Date.now() / 1000) }) }) }); } catch (e) {} }
    renderCard();
    const again = $("profBox").querySelector(".pbtn");   // the box was drawn again: show the result on the new button
    if (again) { again.textContent = S.saved; again.classList.add("ok"); setTimeout(() => { again.textContent = S.saveBtn; again.classList.remove("ok"); }, 2500); }
    pollOrders.memberAt = 0; setTimeout(pollOrders, 15000);
  };
  row.append(go);
  if (acct) { const out = el("button", "pbtn plain", S.outBtn); out.onclick = () => { acct = null; LS.set("ws_acct", null); try { localStorage.removeItem("ws_card"); } catch (e) {} member.n = ""; member.p = 0; member.s = 0; member.x = ""; myPoints = 0; renderCard(); }; row.append(out); }
  box.append(h, msg, name, phone, row);
  if (!acct) box.append(el("p", "", S.guest));
  $("mcard").classList.toggle("hide", !acct && !member.s);
  $("tierNote").classList.toggle("hide", !acct && !member.s);
}
function drawSite() {   // the home page's "normal website" parts: popular picks, hours & location
  const S = t().site, a = menu.about || {}, picks = $("picks"); picks.textContent = "";
  const want = a.featured || [], all = [];
  for (const cat of menu.categories) for (const it of cat.items) if (it.img) all.push([it, cat]);
  const chosen = (want.length ? want.map(id => all.find(x => x[0].id === id)).filter(Boolean) : all.filter((x, i, arr) => arr.findIndex(y => y[1].id === x[1].id) === i).concat(all).filter((x, i, arr) => arr.indexOf(x) === i)).slice(0, 8);
  for (const [it, cat] of chosen) {
    const b = el("button", "pick"), im = document.createElement("img"); im.alt = ""; im.loading = "lazy"; im.src = it.img;
    const low = it.options && it.options.length ? Math.min(...it.options.map(o => o.price)) : it.price;
    b.append(im, el("b", "", tr(it.name)), el("span", "", money(low)));
    b.onclick = () => { openGroup((groups().find(g => g.categories.includes(cat.id)) || groups()[0]).id); openItem(it, cat); };
    picks.append(b);
  }
  $("pickBox").classList.toggle("hide", !chosen.length);
  $("pickTitle").textContent = S.pickTitle; $("pickMore").textContent = S.pickMore;
  $("pickMore").onclick = () => $("openMenu").click();
  $("visitTitle").textContent = S.visitTitle;
  const v = $("visit"); v.textContent = "";
  const line = (label, text) => { if (!text) return; const d = el("div"); d.append(el("b", "", label), el("span", "", text)); v.append(d); };
  line(S.hoursL, tr(a.hours)); line(S.addrL, tr(a.address)); line(S.contactL, [a.phone, a.whatsapp && a.whatsapp !== a.phone ? "WhatsApp " + a.whatsapp : ""].filter(Boolean).join(" · "));
  drawOrders();
}
const baseRenderCard = renderCard, baseRenderHome = renderHome;
renderCard = function () { baseRenderCard(); drawOrders(); drawProfile(); pollOrders(); };
renderHome = function () { baseRenderHome(); drawSite(); };
setInterval(pollOrders, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollOrders(); });

applyLang();
fetch("menu.json?t=" + Date.now(), { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    if ((data.build || 0) > BUILD && !/[?&]_b=/.test(location.search)) {   // this copy of the page is older than the menu
      location.replace(location.pathname + (location.search ? location.search + "&" : "?") + "_b=" + data.build + location.hash);
      return;
    }
    menu = data;
    for (const cat of menu.categories) for (const it of cat.items) {
      const gid = (groups().find(g => g.categories.includes(cat.id)) || {}).id;
      groupOfKey[it.id] = gid;
      for (const o of it.options || []) groupOfKey[it.id + "~" + o.id] = gid;
      if (it.options && it.options.length) for (const o of it.options) {
        const k = it.id + "~" + o.id; prices[k] = o.price;
        names[k] = Object.fromEntries(Object.keys(it.name).map(l => [l, `${it.name[l]} (${o.name[l] || ""})`]));
      } else { prices[it.id] = it.price; names[it.id] = it.name; }
    }
    applyLang(); show("home"); splashOff();
    if (!inTelegram) {   // the website opens on its own home page (no "enter the shop" screen); the member's name comes back
      $("welcome").classList.add("hide");
      if (acct) member.n = member.n || acct.n;
      pollOrders();
    }
  })
  .catch(() => { $("about").textContent = t().fail; splashOff(); });
</script>

<!-- ============ looks only: line icons (Lucide) where the texts carry an emoji ============
     The texts, the menu and the order message keep their emoji (the shop's Telegram messages use them);
     this only changes how they are DRAWN on the page. No icons library → the emoji simply stay. -->
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
(function () {
  const L = window.lucide;
  if (!L || !L.createElement) return;
  const MAP = {
    "🌿": "Leaf", "🍽": "Utensils", "📍": "MapPin", "🕒": "Clock", "🕘": "Clock", "🕗": "Clock", "⏰": "Clock", "🛵": "Bike", "📷": "Instagram", "🌙": "Moon",
    "🛒": "ShoppingCart", "📦": "Package", "⭐": "Star", "🌟": "Star", "🍹": "Martini", "🍸": "Martini", "🥤": "CupSoda", "🍰": "CakeSlice", "🍳": "EggFried",
    "🍜": "Soup", "🍲": "Soup", "🍛": "Soup", "🥘": "CookingPot", "🍟": "Popcorn", "🍨": "IceCreamBowl", "☕": "Coffee", "🍵": "Coffee", "🍓": "Cherry",
    "➕": "Plus", "🥣": "Salad", "🥗": "Salad", "🏪": "Store", "📱": "Smartphone", "💵": "Banknote", "💰": "Wallet", "📝": "NotebookPen", "👤": "User",
    "📞": "Phone", "🟢": "MessageCircle", "💬": "MessageCircle", "✅": "CircleCheck", "⚠": "TriangleAlert", "🔍": "Search", "🚪": "DoorClosed", "🎁": "Gift",
    "🏠": "House", "🗺": "Map", "🧾": "Receipt", "💳": "CreditCard", "🔑": "Key", "📏": "Ruler", "🌐": "Globe", "▶": "Play", "❌": "X", "🚫": "Ban",
    "🍯": "Droplets", "🛍": "ShoppingBag", "👨": "ChefHat", "🏁": "Flag", "⏳": "Hourglass", "⌛": "Hourglass", "🔄": "RefreshCw", "🚚": "Truck", "✨": "Sparkles",
    "❤": "Heart", "💚": "Heart", "🎵": "Music", "🎶": "Music", "📅": "Calendar", "🗓": "Calendar", "🎉": "PartyPopper", "🍷": "Wine", "🍺": "Beer", "🍻": "Beer",
    "🥪": "Sandwich", "🍕": "Pizza", "🐟": "Fish", "🔥": "Flame", "☀": "Sun", "🌴": "TreePalm", "🏝": "TreePalm", "🌅": "Sunset", "🍌": "Banana", "🍗": "Drumstick",
    "🥥": "Nut", "🥜": "Nut", "🍊": "Citrus", "🍋": "Citrus", "🥭": "Citrus", "🍎": "Apple", "🧊": "Snowflake", "❄": "Snowflake", "💧": "Droplet", "📊": "ChartColumn",
    "🆕": "BadgePlus", "🔔": "Bell", "📣": "Megaphone", "🎂": "Cake", "🧑": "User", "👥": "Users", "🏷": "Tag", "💸": "Banknote", "🪙": "Coins", "🎫": "Ticket",
  };
  const KEEP = /^[✓✔★✦←→↑↓©®™]/;
  const RE = /\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic}|[\u{1F3FB}-\u{1F3FF}])*/gu;
  const SKIP = "#viaText, #testnote, script, style, textarea, input, select, option, title";
  function icon(name) {
    const node = name && ((L.icons && L.icons[name]) || L[name]);
    if (!node) return null;
    const svg = L.createElement(node);
    svg.setAttribute("stroke-width", "1.5"); svg.setAttribute("class", "ico-l"); svg.setAttribute("aria-hidden", "true");
    return svg;
  }
  function fix(node) {
    const s = node.nodeValue, par = node.parentNode;
    if (!s || !par || par.nodeType !== 1 || par.closest(SKIP)) return;
    RE.lastIndex = 0;
    if (!RE.test(s)) return;
    RE.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m, did = false;
    while ((m = RE.exec(s))) {
      if (KEEP.test(m[0])) continue;
      frag.append(s.slice(last, m.index));
      const ic = icon(MAP[[...m[0]][0]]);   // an emoji the map does not know is simply left out
      if (ic) frag.append(ic);
      last = m.index + m[0].length; did = true;
    }
    if (!did) return;
    frag.append(s.slice(last));
    par.replaceChild(frag, node);
  }
  function hint(elm) {   // a placeholder cannot hold an icon: its emoji is just taken out
    const p = elm.getAttribute("placeholder");
    if (p && RE.test(p)) { RE.lastIndex = 0; elm.setAttribute("placeholder", p.replace(RE, m => KEEP.test(m) ? m : "").trim()); }
    RE.lastIndex = 0;
  }
  function sweep(root) {
    if (root.nodeType === 3) return fix(root);
    if (root.nodeType !== 1) return;
    if (root.hasAttribute("placeholder")) hint(root);
    root.querySelectorAll("[placeholder]").forEach(hint);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list = [];
    while (w.nextNode()) list.push(w.currentNode);
    list.forEach(fix);
  }
  sweep(document.body);
  new MutationObserver(ms => { for (const m of ms) { if (m.type === "characterData") fix(m.target); else if (m.type === "attributes") hint(m.target); else m.addedNodes.forEach(sweep); } })
    .observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["placeholder"] });
})();
</script>
